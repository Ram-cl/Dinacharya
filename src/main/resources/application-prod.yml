spring:
  datasource:
    # TiDB Serverless requires TLS. Do not set DATABASE_URL / SPRING_DATASOURCE_URL
    # without sslMode=VERIFY_IDENTITY or the pool will be rewritten anyway in prod.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:4000}/${DB_NAME:kanbandb}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&createDatabaseIfNotExist=true&serverTimezone=UTC&autoReconnect=true
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.kanban: INFO
    org.springframework.security: WARN
