spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:kanbandb}?useSSL=${DB_USE_SSL:false}&sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&autoReconnect=true&createDatabaseIfNotExist=true&serverTimezone=UTC}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.kanban: INFO
    org.springframework.security: WARN
  file:
    name: logs/kanban-backend.log
    max-size: 1GB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
